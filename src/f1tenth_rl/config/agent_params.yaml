rl_agent:
  ros__parameters:
    # Training parameters
    training_mode: false      # Set to false for deployment/testing
    model_type: 'sb3_ppo'    # Options: 'dqn', 'ppo', 'sb3_ppo'
    model_path: '/home/meric/f1tenth_ws_rl/src/f1tenth_rl/best_model.zip'
    save_path: 'models/'      # Directory to save trained models
    
    # Environment parameters
    state_dim: 1080           # Auto-overridden to match SB3 checkpoints when needed
    max_steps_per_episode: 1000

    # Real-car SB3 deployment parameters
    speed_odom_topic: '/odom' # Odometry topic used for speed/yaw/angular velocity features
    sb3_observation_layout: 'auto' # auto, scan_speed, or rldd_frenet_scan
    sb3_scan_beams: 2155      # rldd PPO training used 2155 lidar beams
    sb3_lidar_max_range: 10.0 # rldd normalized clipped lidar ranges by 10m
    sb3_reverse_scan: true    # Flip LaserScan left/right before feeding SB3 PPO
    sb3_scan_speed_order: 'speed_first' # 2156-dim rldd FlattenObservation order
    sb3_speed_scale: 3.2      # rldd linear_vel feature was speed / 3.2
    sb3_default_pose_d: 0.0   # Fallback when no centerline CSV is configured
    sb3_centerline_csv: ''    # Leave empty for map-free 2156-dim scan+speed models
    sb3_centerline_x_col: 0   # If using a CSV: x,y,yaw
    sb3_centerline_y_col: 1
    sb3_centerline_yaw_col: 2
    sb3_action_steering_limit: 0.4189
    sb3_action_min_speed: 0.5
    sb3_action_max_speed: 4.0
    drive_steering_limit: 0.4
    drive_min_speed: 0.0
    drive_max_speed: 1.0      # Keep low for first real-car tests
    
    # DQN/custom PPO parameters
    hidden_dim: 256
    learning_rate: 0.0001
    batch_size: 64
    gamma: 0.98              # Discount factor
    epsilon_start: 1.0       # Starting exploration rate
    epsilon_end: 0.05        # Minimum exploration rate
    epsilon_decay: 0.99      # Decay rate for exploration
    
    # Reward components weights
    collision_penalty: -500.0
    speed_reward_weight: 0.3
    steering_penalty_weight: -10.0
    progress_reward_weight: 5.0
    centerline_reward_weight: 25.0

    # Car starting position
    start_x: 0.0
    start_y: 0.0
    start_yaw: 0.0